 <div class="card-iniziale">
  <h2 class="titolo-sezione">Crea il tuo account</h2>

  <form id="form-registrazione">
    <input type="email"id="email" placeholder="La tua email"  required />
    <input type="password" id="password" placeholder="Password (min. 8 caratteri)" minlength="8"  required />

    <button type="submit" class="btn" id="btn-registrati">Registrati</button>

    <p id="messaggio-errore" class="messaggio-errore"></p>
  </form>
</div>

    <script>document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("form-registrazione");
  const messaggioErrore = document.getElementById("messaggio-errore");
  const bottoneRegistrati = document.getElementById("btn-registrati");

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault(); // impedisce il reload automatico della pagina

    // Puliamo eventuali errori precedenti
    messaggioErrore.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Disabilitiamo il bottone per evitare doppi invii mentre aspettiamo la risposta
    bottoneRegistrati.disabled = true;
    bottoneRegistrati.textContent = "Registrazione in corso...";

    try {
      const risposta = await fetch("/api/account/registrazione", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      const dati = await risposta.json();

      if (!risposta.ok) {
        // Il server ha risposto con un errore (400, 409, ecc.)
        throw new Error(dati.errore || "Errore durante la registrazione.");
      }

      // Successo! Qui puoi reindirizzare l'utente o mostrare un messaggio
      alert(`Registrazione avvenuta con successo per ${dati.data.email}!`);
      form.reset();

    } catch (errore) {
      messaggioErrore.textContent = errore.message;

    } finally {
      // Riabilitiamo il bottone in ogni caso, sia successo che errore
      bottoneRegistrati.disabled = false;
      bottoneRegistrati.textContent = "Registrati";
    }
  });
});
</script>
<style>

  color: #FF6B6B; /* stesso rosso che usi già per .elimina */
