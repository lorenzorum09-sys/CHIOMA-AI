<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chioma AI — Account</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <a href="Home.html" class="logo-container">
                <img src="Copilot_20260728_144629.png" alt="Chioma AI Logo" class="logo-img">
                <span class="logo-testo titolo-brand">Chioma AI</span>
            </a>
        
           </header>
        <div class="card-iniziale">
  <h2 class="titolo-sezione">Recupera password</h2>

  <form id="form-login">
    <div class="campo-gruppo">
      <label for="email" class="campo-etichetta">Email</label>
      <input
        type="email"
        id="email"
        placeholder="La tua email"
        class="campo-input"
        required
      />
    </div>



    <button type="submit" class="btn btn-primario" id="btn-accedi">
      Recupera password
    </button>

    <p id="messaggio-errore" class="messaggio-errore"></p>
   
    <p class="testo-link">
      Non hai ancora un account?
      <a href="account.html" class="link-accento">Registrati</a>
    </p>
  </form>
</div>
    </body>
</html>
