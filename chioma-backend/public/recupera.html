<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chioma AI — Account</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <a href="index.html" class="logo-container">
                <img src="Copilot_20260728_144629.png" alt="Chioma AI Logo" class="logo-img">
                <span class="logo-testo titolo-brand">Chioma AI</span>
            </a>
        
            <button type="button" class="btn-hamburger" id="btn-hamburger">
                <span>☰</span>
            </button>
                   <div class="menu-hamburger" id="menu-hamburger">
        <nav class="menu-hamburger-lista">

            <div class="menu-voce">
                <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-lingua" aria-expanded="false">
                    <span class="menu-voce-icona">🌐</span>
                    <span class="menu-voce-testo" data-i18n="menu_lingua">Lingua</span>
                    <span class="menu-voce-freccia">›</span>
                </button>

                <div class="menu-pannello" id="pannello-lingua">
                    <label class="menu-opzione">
                        <input type="radio" name="lingua" value="it" checked>
                        <span>🇮🇹 Italiano</span>
                    </label>
                    <label class="menu-opzione">
                        <input type="radio" name="lingua" value="en">
                        <span>🇬🇧 English</span>
                    </label>
                    <label class="menu-opzione">
                        <input type="radio" name="lingua" value="fr">
                        <span>🇫🇷 Français</span>
                    </label>
                </div>
            </div>
              <div class="menu-voce">
                <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-impostazioni" aria-expanded="false">
                    <span class="menu-voce-icona">⚙️</span>
                    <span class="menu-voce-testo" data-i18n="menu_impostazioni">Impostazioni</span>
                    <span class="menu-voce-freccia">›</span>
                </button>
                <div class="menu-voce">
                <button type="button" class="menu-voce-btn" data-menu-toggle="  pannello-terminieprivacy" aria-expanded="false">
                    <span class="menu-voce-icona">🔒</span>
                    <span class="menu-voce-testo" data-i18n="menu_impostazioni"><a href="analizza.html" data-i18n="link_termini"> Termini di uso e Privacy </a></span>
                    <span class="menu-voce-freccia">›</span>                    
                         <div class="menu-voce">
                <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-terminieprivacy" aria-expanded="false">
                    <span class="menu-voce-icona">👤</span>
                    <span class="menu-voce-testo" data-i18n="menu_impostazioni"><a href="account.html" data-i18n="link_account">Account</a></span>
                    <span class="menu-voce-freccia">›</span>
                </button>
                </div>
            </div>
            </div>
        </nav>
        </header>
        <div class="card-iniziale">
  <h2 class="titolo-sezione">Recupera password</h2>

  <form id="form-login">
    <div class="campo-gruppo">
      <label for="email" class="campo-etichetta">Email</label>
      <input
        type="email"
        id="email"
        placeholder="La tua email"
        class="campo-input"
        required
      />
    </div>



    <button type="submit" class="btn btn-primario" id="btn-accedi">
      Recupera password
    </button>

    <p id="messaggio-errore" class="messaggio-errore"></p>
   
    <p class="testo-link">
      Non hai ancora un account?
      <a href="account.html" class="link-accento">Registrati</a>
    </p>
  </form>
</div>
    </body>
</html>
