    <h1 id="testo-digitato"></h1>

    <div class="card-iniziale">
        <a href="analizza.html" class="btn">Voglio trovare il taglio giusto per me</a>
        <p class="separatore">Oppure</p>
        <a href="analizza.html" class="btn">Preferisco una routine per mantenere il mio stile</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const testo1 = "Cosa vuoi fare oggi?";
            const testo2 = "Come possiamo aiutarti?";
            const testo3 = "Qual è il tuo obiettivo?";
            const testiRandom = [testo1, testo2, testo3];

            const indiceCasuale = Math.floor(Math.random() * testiRandom.length);
            const testoSelezionato = testiRandom[indiceCasuale];

            const elemento = document.getElementById("testo-digitato");
            let indice = 0;
            const velocita = 100;

            function scrivi() {
                if (indice < testoSelezionato.length) {
                    elemento.innerHTML += testoSelezionato.charAt(indice);
                    indice++;
                    setTimeout(scrivi, velocita);
                }
            }

            scrivi();
        });
    </script>
