<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="Copilot_20260728_144629.png" alt="Chioma AI Logo" class="logo-img">
            <span class="logo-testo titolo-brand">Chioma AI</span>
        </a>
   
        <button type="button" class="btn-hamburger" id="btn-hamburger">
            <span>☰</span>
        </button>
               <div class="menu-hamburger" id="menu-hamburger">
    <nav class="menu-hamburger-lista">

        <div class="menu-voce">
            <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-lingua" aria-expanded="false">
                <span class="menu-voce-icona">🌐</span>
                <span class="menu-voce-testo" data-i18n="menu_lingua">Lingua</span>
                <span class="menu-voce-freccia">›</span>
            </button>

            <div class="menu-pannello" id="pannello-lingua">
                <label class="menu-opzione">
                    <input type="radio" name="lingua" value="it" checked>
                    <span>🇮🇹 Italiano</span>
                </label>
                <label class="menu-opzione">
                    <input type="radio" name="lingua" value="en">
                    <span>🇬🇧 English</span>
                </label>
                <label class="menu-opzione">
                    <input type="radio" name="lingua" value="fr">
                    <span>🇫🇷 Français</span>
                </label>
            </div>
        </div>
          <div class="menu-voce">
            <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-impostazioni" aria-expanded="false">
                <span class="menu-voce-icona">⚙️</span>
                <span class="menu-voce-testo" data-i18n="menu_impostazioni">Impostazioni</span>
                <span class="menu-voce-freccia">›</span>
            </button>
         <div class="menu-voce">
            <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-terminieprivacy" aria-expanded="false">
                <span class="menu-voce-icona">🔒</span>
                <span class="menu-voce-testo" data-i18n="menu_impostazioni"><a href="analizza.html" data-i18n="link_termini"> Termini di uso e Privacy </a></span>
                <span class="menu-voce-freccia">›</span>
           </div> 
           <div class="menu-voce">
            <button type="button" class="menu-voce-btn" data-menu-toggle="pannello-terminieprivacy" aria-expanded="false">
                <span class="menu-voce-icona">👤</span>
                <span class="menu-voce-testo" data-i18n="menu_impostazioni"><a href="account.html" data-i18n="link_account">Account</a></span>
                <span class="menu-voce-freccia">›</span>
            </button>
            </div>
                
    </nav>
</div>
    </header>

<div class="card-iniziale">
  <h2 class="titolo-sezione">Accedi al tuo account</h2>

  <form id="form-login">
    <div class="campo-gruppo">
      <label for="email" class="campo-etichetta">Email</label>
      <input
        type="email"
        id="email"
        placeholder="La tua email"
        class="campo-input"
        required
      />
    </div>

    <div class="campo-gruppo">
      <label for="password" class="campo-etichetta">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        class="campo-input"
        required
      />
    </div>

    <button type="submit" class="btn btn-primario" id="btn-accedi">
      Accedi
    </button>

    <p id="messaggio-errore" class="messaggio-errore"></p>
     <p class="testo-link">
      Hai dimenticato la password? <a href="recupera.html" class="link-accento">Recupera</a>
    </p>
    <p class="testo-link">
      Non hai ancora un account?
      <a href="account.html" class="link-accento">Registrati</a>
    </p>
  </form>
</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("form-login");
  const messaggioErrore = document.getElementById("messaggio-errore");
  const bottoneAccedi = document.getElementById("btn-accedi");

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    messaggioErrore.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    bottoneAccedi.disabled = true;
    bottoneAccedi.textContent = "Accesso in corso...";

    try {
      const risposta = await fetch("/api/account/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      const dati = await risposta.json();

      if (!risposta.ok) {
        // Distinguiamo il caso "credenziali sbagliate" dagli altri errori
        if (risposta.status === 401) {
          throw new Error("Email o password non corretti.");
        }
        throw new Error(dati.errore || "Errore durante l'accesso.");
      }

      // Login riuscito
      alert(`Bentornato, ${dati.data.email}!`);
      form.reset();
      // Qui tipicamente reindirizzi l'utente, es:
      // window.location.href = "dashboard.html";

    } catch (errore) {
      messaggioErrore.textContent = errore.message;

    } finally {
      bottoneAccedi.disabled = false;
      bottoneAccedi.textContent = "Accedi";
    }
  });
});
</script>
<style>
    .messaggio-errore {
  color: #FF6B6B; /* stesso rosso che usi già per .elimina */
  font-size: 13px;
  margin-top: 8px;
  min-height: 18px; /* riserva spazio così il layout non "salta" quando appare */
}
</style>
   <div class="transizione" id="overlay-transizione">
        <img src="Copilot_20260728_144629.png" alt="Chioma AI" class="transizione-logo">
    </div>
    <script src="js/lingua.js"></script>

</body>
</html>
