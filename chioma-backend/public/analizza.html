          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; color: var(--rame); margin-bottom: 12px;">

          </span>
          <span style="font-size: 12px; color: var(--testo-muto);" data-i18n="analizza_sub_upload">

      <button type="button" class="bottone-secondario elimina" id="btn-rimuovi-foto" data-i18n="btn_rimuovi_foto">Rimuovi</button>
    </div>

    <button type="button" class="bottone" id="btn-analizza" style="display: none; background: var(--salvia); color: #12100E;" data-i18n="btn_analizza">
